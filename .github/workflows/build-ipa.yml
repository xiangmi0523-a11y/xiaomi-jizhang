name: 构建晓米记账 IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel   # arm64 机器排队太久时改用 Intel 机器打包
    steps:
      - uses: actions/checkout@v4

      - name: 选择较新的 Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC/Contents/Developer"; fi
          xcodebuild -version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译（不签名）
        run: |
          xcodebuild \
            -project XiaomiJizhang.xcodeproj \
            -scheme XiaomiJizhang \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION=1.0.${{ github.run_number }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || {
            grep -E "error:|BUILD FAILED|fatal" build.log | sort -u | head -20 | while IFS= read -r line; do echo "::error::${line}"; done
            tail -n 80 build.log
            exit 1
          }
          tail -n 5 build.log

      - name: 打包 IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/XiaomiJizhang.app"
          test -d "$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          # 用 ad-hoc 签名把 App Group 权限写进包里，方便全能签重签时保留（小组件读取数据要用）
          PA="Payload/XiaomiJizhang.app"
          if [ -d "$PA/PlugIns/XiaomiWidget.appex" ]; then
            codesign --force --sign - --entitlements ios/XiaomiWidget.entitlements "$PA/PlugIns/XiaomiWidget.appex"
          fi
          codesign --force --sign - --entitlements ios/XiaomiJizhang.entitlements "$PA"
          echo "::notice::包内容 $(cd "$PA" && ls | tr '\n' ' ')"
          echo "::notice::插件 $(ls "$PA/PlugIns" 2>/dev/null | tr '\n' ' ')"
          echo "::notice::App 权限 $(codesign -d --entitlements - --xml "$PA" 2>/dev/null | tr -d '\n\t' | head -c 600)"
          echo "::notice::小组件权限 $(codesign -d --entitlements - --xml "$PA/PlugIns/XiaomiWidget.appex" 2>/dev/null | tr -d '\n\t' | head -c 600)"
          zip -qry XiaomiJizhang.ipa Payload
          echo "== IPA 内容 =="
          unzip -l XiaomiJizhang.ipa | head -40
          echo "== Info.plist =="
          plutil -p "$APP/Info.plist" | head -40
          ls -la XiaomiJizhang.ipa

      - name: 保存构建产物
        uses: actions/upload-artifact@v4
        with:
          name: XiaomiJizhang-ipa
          path: XiaomiJizhang.ipa

      - name: 发布到 Releases（手机可直接下载）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" XiaomiJizhang.ipa \
            --title "晓米记账 $TAG" \
            --notes "未签名 IPA，用全能签导入后签名安装。更新安装时请保持包名不变，数据会保留。" \
            --latest
