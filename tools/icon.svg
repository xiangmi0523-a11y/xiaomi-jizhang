<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFD76A"/>
      <stop offset="1" stop-color="#FFAE1F"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="1" stop-color="#F5A312"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- 米粒点缀 -->
  <g fill="#FFF3C9" opacity=".55">
    <ellipse cx="170" cy="190" rx="34" ry="16" transform="rotate(-30 170 190)"/>
    <ellipse cx="860" cy="170" rx="30" ry="14" transform="rotate(25 860 170)"/>
    <ellipse cx="120" cy="820" rx="30" ry="14" transform="rotate(20 120 820)"/>
    <ellipse cx="900" cy="850" rx="34" ry="16" transform="rotate(-25 900 850)"/>
  </g>
  <!-- 身体阴影 -->
  <ellipse cx="512" cy="905" rx="250" ry="34" fill="#C97A00" opacity=".25"/>
  <!-- 耳朵 -->
  <polygon points="262,470 296,212 506,352" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="44" stroke-linejoin="round"/>
  <polygon points="762,470 728,212 518,352" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="44" stroke-linejoin="round"/>
  <polygon points="318,420 336,296 424,358" fill="#FFB5A3" stroke="#FFB5A3" stroke-width="22" stroke-linejoin="round"/>
  <polygon points="706,420 688,296 600,358" fill="#FFB5A3" stroke="#FFB5A3" stroke-width="22" stroke-linejoin="round"/>
  <!-- 脸 -->
  <ellipse cx="512" cy="590" rx="318" ry="268" fill="#FFFFFF"/>
  <!-- 额头金币 -->
  <circle cx="512" cy="418" r="66" fill="url(#coin)" stroke="#E39A0B" stroke-width="10"/>
  <text x="512" y="448" text-anchor="middle" font-family="Noto Sans CJK SC, Arial, sans-serif" font-weight="900" font-size="88" fill="#A86400">¥</text>
  <!-- 眼睛 -->
  <path d="M352 584 q38 -52 76 0" fill="none" stroke="#4A3200" stroke-width="24" stroke-linecap="round"/>
  <path d="M596 584 q38 -52 76 0" fill="none" stroke="#4A3200" stroke-width="24" stroke-linecap="round"/>
  <!-- 腮红 -->
  <ellipse cx="318" cy="650" rx="44" ry="28" fill="#FF9F90" opacity=".6"/>
  <ellipse cx="706" cy="650" rx="44" ry="28" fill="#FF9F90" opacity=".6"/>
  <!-- 鼻子嘴巴 -->
  <path d="M488 634 h48 l-24 28 z" fill="#FF8C7A" stroke="#FF8C7A" stroke-width="12" stroke-linejoin="round"/>
  <path d="M512 664 v18 M512 682 q-28 30 -60 8 M512 682 q28 30 60 8" fill="none" stroke="#4A3200" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 胡须 -->
  <g stroke="#E7D7B0" stroke-width="11" stroke-linecap="round">
    <line x1="214" y1="620" x2="120" y2="596"/><line x1="214" y1="664" x2="112" y2="672"/>
    <line x1="810" y1="620" x2="904" y2="596"/><line x1="810" y1="664" x2="912" y2="672"/>
  </g>
</svg>
